  <polyline points="620,513 655,513 655,701 624,701" fill="none" stroke="#48cae4" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ac)"/>
  <text x="662" y="600" font-size="10" fill="#48cae4" opacity="0.8">标记问题并继续</text>
  <text x="662" y="614" font-size="10" fill="#48cae4" opacity="0.6">忽略项写入 manifest</text>
  <rect x="690" y="700" width="250" height="56" fill="#0d1f3c" stroke="#00b4d8" stroke-width="1"/>
  <line x1="690" y1="714" x2="940" y2="714" stroke="#00b4d8" stroke-width="0.5"/>
  <text x="815" y="711" text-anchor="middle" font-size="9" fill="#48cae4">FLOW · PRODUCTION PIPELINE · 2026-08-30</text>
  <text x="815" y="736" text-anchor="middle" font-size="12" font-weight="700" fill="#00b4d8">生产流程图</text>
  <text x="815" y="751" text-anchor="middle" font-size="9" fill="#48cae4" opacity="0.7">绿=修改回路 · 橙=失败回路 · 虚=不中断旁路</text>
