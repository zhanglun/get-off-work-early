  <line x1="480" y1="540" x2="480" y2="580" stroke="#00b4d8" stroke-width="1.2" marker-end="url(#ac)"/>
  <line x1="480" y1="634" x2="480" y2="674" stroke="#00b4d8" stroke-width="1.2" marker-end="url(#ac)"/>
