  <text x="60" y="256" font-size="10" fill="#06d6a0" opacity="0.7">修改回路 · G2A</text>
  <rect x="700" y="392" width="220" height="50" rx="2" fill="#0d1f3c" stroke="#f77f00" stroke-width="1"/>
