<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780">
  <style>text { font-family: 'Courier New','Lucida Console','PingFang SC','Microsoft YaHei','SimHei',monospace; fill: #caf0f8; }</style>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#112240" stroke-width="0.5"/></pattern>
    <marker id="ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00b4d8"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f77f00"/></marker>
  </defs>
  <rect width="960" height="780" fill="#0a1628"/>
