<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Short Drama Production Copilot</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    body { margin: 0; background: #0f172a; } main { max-width: 1400px; margin: auto; padding: 24px; }
    h1 { margin: 0 0 6px; } .muted { color: #94a3b8; } .grid { display: grid; grid-template-columns: 360px 1fr; gap: 16px; margin-top: 20px; }
    section { background: #111c32; border: 1px solid #263653; border-radius: 12px; padding: 16px; }
    textarea, input { width: 100%; box-sizing: border-box; color: #e2e8f0; background: #0b1220; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin: 6px 0 10px; }
    textarea { min-height: 220px; resize: vertical; } button { border: 0; border-radius: 8px; padding: 9px 13px; margin: 3px; color: white; background: #2563eb; cursor: pointer; } button.secondary { background: #475569; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; } pre { white-space: pre-wrap; overflow: auto; max-height: 520px; background: #0b1220; padding: 12px; border-radius: 8px; }
    .chat { display: flex; gap: 8px; } .chat input { margin: 0; flex: 1; } .card { border-left: 3px solid #38bdf8; padding-left: 10px; margin: 10px 0; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Short Drama Production Copilot</h1>
  <div class="muted">聊天入口 + 结构化资产工作区 · Project → Episode → StoryBible → Scene → Shot</div>
  <div class="grid">
    <section>
      <h2>导入剧本</h2>
      <input id="projectName" value="我的短剧" placeholder="项目名称" />
      <textarea id="script"># 咖啡馆初遇

## 第1场 夜 / 写字楼门口
【人物】林小雨、陈默
【动作】林小雨抱着文件冲出旋转门，撞上陈默。
【对白】陈默：你的合同掉了。

## 第2场 次日白天 / 咖啡馆靠窗位
【人物】林小雨、陈默
【动作】陈默端着咖啡寻找位置，林小雨抬头看向他。
【对白】林小雨：是你？</textarea>
      <button id="import">分析剧本</button>
      <div id="status" class="muted"></div>
      <div class="row">
        <button id="confirmBible" class="secondary">确认 StoryBible</button>
        <button id="planScenes" class="secondary">生成场次</button>
        <button id="confirmScenes" class="secondary">确认场次</button>
        <button id="produce" class="secondary">生成分镜</button>
        <button id="export" class="secondary">导出 JSON</button>
      </div>
      <h2>聊天</h2>
      <div class="chat"><input id="message" placeholder="例如：询问人物动机" /><button id="send">发送</button></div>
      <pre id="chatOutput">等待聊天请求…</pre>
    </section>
    <section>
      <h2>结构化资产</h2>
      <div id="assetMeta" class="muted">还没有任务</div>
      <pre id="assets">提交剧本后，StoryBible、Scene 和 Shot 会显示在这里。</pre>
    </section>
  </div>
</main>
<script>
  let episodeId = null, runId = null;
  const $ = (id) => document.getElementById(id);
  const show = (id, value) => $(id).textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
  const waitJob = async (path) => { for (let i=0; i<100; i++) { const value = await fetch(path).then(r=>r.json()); if (value.status === 'done' || value.status === 'failed') return value; await new Promise(r=>setTimeout(r, 150)); } throw Error('任务超时'); };
  const refresh = async () => { if (!episodeId) return; const [bible, scenes, shots] = await Promise.all([fetch(`/episodes/${episodeId}/story-bible`).then(r=>r.json()), fetch(`/episodes/${episodeId}/scenes`).then(r=>r.json()), fetch(`/episodes/${episodeId}/shots`).then(r=>r.json())]); show('assetMeta', `episodeId: ${episodeId}\nStoryBible: ${bible.status}\nScenes: ${scenes.status ?? '未生成'}\nShots: ${shots.shots?.length ?? 0}`); show('assets', { storyBible: bible.storyBible, scenes: scenes.scenes, shots: shots.shots }); };
  $('import').onclick = async () => { show('status', '正在分析…'); const body = { projectName: $('projectName').value, episodeNo: 1, scriptText: $('script').value }; const start = await fetch('/story-understandings', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body) }).then(r=>r.json()); const job = await waitJob(`/story-understandings/${start.runId}`); episodeId = job.episodeId; show('status', `分析完成：${episodeId}`); await refresh(); };
  $('confirmBible').onclick = async () => { if (!episodeId) return; await fetch(`/episodes/${episodeId}/story-bible/confirm`, {method:'POST'}); await refresh(); };
  $('planScenes').onclick = async () => { if (!episodeId) return; const start = await fetch(`/episodes/${episodeId}/scenes`, {method:'POST'}).then(r=>r.json()); await waitJob(`/scene-plannings/${start.runId}`); await refresh(); };
  $('confirmScenes').onclick = async () => { if (!episodeId) return; await fetch(`/episodes/${episodeId}/scenes/confirm`, {method:'POST'}); await refresh(); };
  $('produce').onclick = async () => { if (!episodeId) return; const start = await fetch(`/episodes/${episodeId}/production`, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({})}).then(r=>r.json()); await waitJob(`/storyboard-productions/${start.runId}`); await refresh(); };
  $('export').onclick = async () => { if (!episodeId) return; const result = await fetch(`/episodes/${episodeId}/export`, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({format:'json'})}).then(r=>r.json()); show('chatOutput', result.content ?? result); };
  $('send').onclick = async () => { const result = await fetch('/chat', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({message:$('message').value, episodeId})}).then(r=>r.json()); show('chatOutput', result); await refresh(); };
</script>
</body>
</html>
