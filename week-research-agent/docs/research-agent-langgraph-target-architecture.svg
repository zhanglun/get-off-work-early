<text x="60" y="54" class="title">WEEK-RESEARCH-AGENT · LangGraph 目标架构</text>
<text x="60" y="80" class="subtitle">迁移设计图（尚未落地）· 复用现有工具、RAG、记忆与 HTTP 层，用 StateGraph 显式编排状态、循环与路由</text>
<line x1="60" y1="98" x2="1740" y2="98" stroke="#00b4d8" stroke-width="1" opacity=".7"/>
<rect x="45" y="125" width="340" height="330" rx="3" fill="#0d1f3c" fill-opacity=".62" stroke="#00b4d8" stroke-width="1" stroke-dasharray="7,4" data-graph-role="container"/>
<text x="63" y="151" class="section">01 保持不变的交付层</text>
<text x="63" y="169" class="small">保留现有 server/ 作为接入入口</text>
<rect x="430" y="125" width="870" height="560" rx="3" fill="#0d1f3c" fill-opacity=".62" stroke="#00b4d8" stroke-width="1" stroke-dasharray="7,4" data-graph-role="container"/>
<text x="448" y="151" class="section">02 LangGraph 单课题研究图</text>
<text x="448" y="169" class="small">langgraph_version/ · StateGraph 节点 + 条件边 + ToolNode</text>
<rect x="1345" y="125" width="410" height="560" rx="3" fill="#0d1f3c" fill-opacity=".62" stroke="#00b4d8" stroke-width="1" stroke-dasharray="7,4" data-graph-role="container"/>
<text x="1363" y="151" class="section">03 复用能力</text>
<text x="1363" y="169" class="small">现有模块作为适配器复用，不推倒重写</text>
<rect x="45" y="730" width="890" height="250" rx="3" fill="#0d1f3c" fill-opacity=".62" stroke="#00b4d8" stroke-width="1" stroke-dasharray="7,4" data-graph-role="container"/>
<text x="63" y="756" class="section">04 状态持久化与可观测性</text>
<text x="63" y="774" class="small">区分对话记忆与图执行检查点</text>
<rect x="980" y="730" width="775" height="250" rx="3" fill="#0d1f3c" fill-opacity=".62" stroke="#00b4d8" stroke-width="1" stroke-dasharray="7,4" data-graph-role="container"/>
<text x="998" y="756" class="section">05 LangGraph 大课题工作流图</text>
<text x="998" y="774" class="small">Planner 经 Send 扇出 → 子图研究 × N → Synthesizer 汇总</text>
