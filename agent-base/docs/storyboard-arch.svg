<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowData" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1800" height="1300" fill="#f8fafc"/>

  <!-- title -->
  <text x="60" y="56" font-size="26" font-weight="700" fill="#0f172a">Storyboard Agent — 架构 v1</text>
  <text x="60" y="82" font-size="14" fill="#64748b">异步任务式 · 每镜独立 generator-critic loop · NestJS + Prisma + BullMQ(Redis) + PG</text>

  <!-- ============ Layer 1: Client ============ -->
  <rect x="40" y="110" width="1720" height="176" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" data-graph-role="container"/>
  <text x="56" y="136" font-size="13" font-weight="700" fill="#1d4ed8">01 · 客户端层 CLIENT</text>

  <g>
    <rect x="120" y="160" width="240" height="88" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="120" y="160" width="240" height="88" rx="8" fill="none" stroke="#1d4ed8" stroke-width="1" transform="translate(4,4)"/>
    <text x="240" y="198" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">前端（调用方）</text>
    <text x="240" y="222" font-size="12" fill="#64748b" text-anchor="middle">提交剧本 · 轮询任务 · 取分镜表</text>
  </g>

  <g>
    <rect x="440" y="160" width="260" height="88" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="440" y="160" width="260" height="88" rx="8" fill="none" stroke="#1d4ed8" stroke-width="1" transform="translate(4,4)"/>
    <text x="570" y="190" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">盲测打分页（周五验收）</text>
    <text x="570" y="212" font-size="12" fill="#64748b" text-anchor="middle">逐镜新旧并排·随机侧序·选优+双分</text>
    <text x="570" y="230" font-size="12" fill="#64748b" text-anchor="middle">队友开发 · review_log 可视化</text>
  </g>

  <g>
    <rect x="1480" y="160" width="250" height="88" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="1605" y="198" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">原系统接口（旧输出）</text>
    <text x="1605" y="222" font-size="12" fill="#64748b" text-anchor="middle">单次 LLM 调用 · 已存在</text>
  </g>

  <!-- ============ Layer 2: API ============ -->
  <rect x="40" y="318" width="1720" height="200" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" data-graph-role="container"/>
  <text x="56" y="344" font-size="13" font-weight="700" fill="#15803d">02 · 接口层 API（NestJS）</text>

  <g>
    <rect x="120" y="368" width="320" height="120" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="280" y="396" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">TaskController</text>
    <text x="280" y="420" font-size="12" fill="#64748b" text-anchor="middle">POST /tasks（剧本+配置 → 任务ID）</text>
    <text x="280" y="440" font-size="12" fill="#64748b" text-anchor="middle">GET /tasks/:id（状态/进度）</text>
    <text x="280" y="460" font-size="12" fill="#64748b" text-anchor="middle">GET /tasks/:id/shots（分镜+review_log）</text>
  </g>

  <g>
    <rect x="520" y="368" width="300" height="120" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="670" y="396" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">ScoreController</text>
    <text x="670" y="420" font-size="12" fill="#64748b" text-anchor="middle">GET /tasks/:id/pairs（盲测对）</text>
    <text x="670" y="440" font-size="12" fill="#64748b" text-anchor="middle">POST /scores（按侧序归因落库）</text>
    <text x="670" y="460" font-size="12" fill="#64748b" text-anchor="middle">GET /tasks/:id/scores（报表）</text>
  </g>

  <g>
    <rect x="900" y="368" width="300" height="120" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="1050" y="396" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">模板/配置接口</text>
    <text x="1050" y="420" font-size="12" fill="#64748b" text-anchor="middle">下游模型提示词模板 CRUD</text>
    <text x="1050" y="440" font-size="12" fill="#64748b" text-anchor="middle">（用户可选模型 · 纯配置位）</text>
  </g>

  <g>
    <path d="M1280 368 L1280 344 L1352 344 L1352 400 L1330 400" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="1352" y="368" width="240" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="1472" y="396" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">API DTO + zod 契约</text>
    <text x="1472" y="420" font-size="12" fill="#64748b" text-anchor="middle">接口契约先定 → 验证页</text>
    <text x="1472" y="440" font-size="12" fill="#64748b" text-anchor="middle">与后端并行开发</text>
  </g>

  <!-- ============ Layer 3: Agent Core ============ -->
  <rect x="40" y="550" width="1720" height="330" rx="8" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.5" data-graph-role="container"/>
  <text x="56" y="576" font-size="13" font-weight="700" fill="#a21caf">03 · 智能层 AGENT CORE（worker 进程）</text>

  <g>
    <rect x="120" y="608" width="300" height="120" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="2"/>
    <text x="270" y="636" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">BullMQ Worker</text>
    <text x="270" y="660" font-size="12" fill="#64748b" text-anchor="middle">每集 1 个 job</text>
    <text x="270" y="680" font-size="12" fill="#64748b" text-anchor="middle">镜级并发 P（默认 4，可配）</text>
    <text x="270" y="700" font-size="12" fill="#64748b" text-anchor="middle">失败重试 · 状态回写</text>
  </g>

  <g>
    <rect x="520" y="608" width="280" height="120" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="2"/>
    <text x="660" y="636" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">LegacyImporter 导入</text>
    <text x="660" y="660" font-size="12" fill="#64748b" text-anchor="middle">调旧接口：分镜列表 + 旧提示词</text>
    <text x="660" y="680" font-size="12" fill="#64748b" text-anchor="middle">落 OldShot（盲测基线）· 重试2次</text>
    <text x="660" y="700" font-size="12" fill="#64748b" text-anchor="middle">+ 轻量角色提取（demo后换Parser）</text>
  </g>

  <!-- Shot Loop: the core -->
  <g>
    <rect x="880" y="596" width="380" height="200" rx="10" fill="#ffffff" stroke="#a21caf" stroke-width="2.5"/>
    <rect x="880" y="596" width="380" height="200" rx="10" fill="none" stroke="#a21caf" stroke-width="1" transform="translate(5,5)"/>
    <text x="1070" y="628" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Shot Loop（每镜独立）</text>
    <text x="1070" y="654" font-size="13" fill="#334155" text-anchor="middle">Director 生成 → Reviewer 审查 → Refiner 改写</text>
    <text x="1070" y="678" font-size="12" fill="#64748b" text-anchor="middle">审查规则：镜头语言 + 画面逻辑（防穿帮）</text>
    <text x="1070" y="698" font-size="12" fill="#64748b" text-anchor="middle">+ 相邻镜一致性（角色外观/位置/时序）</text>
    <text x="1070" y="722" font-size="12" fill="#b91c1c" text-anchor="middle">≤3 轮可配 · 仍不过 → 标记 needs_review</text>
    <text x="1070" y="746" font-size="12" fill="#64748b" text-anchor="middle">全程留 review_log（轮次/问题/修改）</text>
    <text x="1070" y="772" font-size="12" fill="#64748b" text-anchor="middle">输出：推理 rationale + 最终提示词</text>
  </g>

  <g>
    <rect x="1340" y="608" width="220" height="120" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="2"/>
    <text x="1450" y="636" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Context Builder</text>
    <text x="1450" y="660" font-size="12" fill="#64748b" text-anchor="middle">角色卡 + 相邻镜上下文</text>
    <text x="1450" y="680" font-size="12" fill="#64748b" text-anchor="middle">（防穿帮 · 输入侧注入）</text>
    <text x="1450" y="700" font-size="12" fill="#64748b" text-anchor="middle">后续可挂长期记忆</text>
  </g>

  <g>
    <rect x="1340" y="752" width="220" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="1450" y="792" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">prompts/ 外置文件</text>
    <text x="1450" y="816" font-size="12" fill="#64748b" text-anchor="middle">director · reviewer · refiner</text>
    <text x="1450" y="836" font-size="12" fill="#64748b" text-anchor="middle">（队友调优不碰代码）</text>
  </g>

  <!-- ============ Layer 4: Infra ============ -->
  <rect x="40" y="912" width="1720" height="230" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" data-graph-role="container"/>
  <text x="56" y="938" font-size="13" font-weight="700" fill="#475569">04 · 基础设施层 INFRA（公司现成）</text>

  <g>
    <rect x="100" y="960" width="270" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="235" y="992" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">LLM Client</text>
    <text x="235" y="1016" font-size="12" fill="#64748b" text-anchor="middle">OpenAI 兼容封装</text>
    <text x="235" y="1036" font-size="12" fill="#64748b" text-anchor="middle">复用原团队端点 · 可切换</text>
    <text x="235" y="1056" font-size="12" fill="#64748b" text-anchor="middle">结构化输出 + token 计量</text>
  </g>

  <g>
    <path d="M385 960 L385 948 L615 948 L615 960" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="500" cy="965" rx="115" ry="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <rect x="385" y="965" width="230" height="100" fill="#ffffff" stroke="none"/>
    <line x1="385" y1="965" x2="385" y2="1065" stroke="#475569" stroke-width="2"/>
    <line x1="615" y1="965" x2="615" y2="1065" stroke="#475569" stroke-width="2"/>
    <ellipse cx="500" cy="1065" rx="115" ry="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="500" y="1010" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">PostgreSQL</text>
    <text x="500" y="1034" font-size="12" fill="#64748b" text-anchor="middle">shot / review_log / character</text>
    <text x="500" y="1054" font-size="12" fill="#64748b" text-anchor="middle">Prisma · 领域数据</text>
  </g>

  <g>
    <ellipse cx="800" cy="965" rx="105" ry="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <rect x="695" y="965" width="210" height="100" fill="#ffffff" stroke="none"/>
    <line x1="695" y1="965" x2="695" y2="1065" stroke="#475569" stroke-width="2"/>
    <line x1="905" y1="965" x2="905" y2="1065" stroke="#475569" stroke-width="2"/>
    <ellipse cx="800" cy="1065" rx="105" ry="12" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="800" y="1010" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Redis</text>
    <text x="800" y="1034" font-size="12" fill="#64748b" text-anchor="middle">BullMQ 任务队列</text>
    <text x="800" y="1054" font-size="12" fill="#64748b" text-anchor="middle">并发控制</text>
  </g>

  <g>
    <rect x="960" y="960" width="280" height="130" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="1100" y="990" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">任务中心（公司模块）</text>
    <text x="1100" y="1014" font-size="12" fill="#64748b" text-anchor="middle">任务建档 · 状态流转 · 进度记录</text>
    <text x="1100" y="1034" font-size="12" fill="#64748b" text-anchor="middle">单一事实源：异步任务数据/状态</text>
    <text x="1100" y="1054" font-size="12" fill="#64748b" text-anchor="middle">本服务走适配层对接（含 mock）</text>
  </g>

  <g>
    <rect x="1300" y="960" width="300" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="1450" y="992" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">可观测（横切）</text>
    <text x="1450" y="1016" font-size="12" fill="#64748b" text-anchor="middle">每任务：token 成本 / 耗时 / 轮次</text>
    <text x="1450" y="1036" font-size="12" fill="#64748b" text-anchor="middle">每镜：审查发现 / 重试次数</text>
    <text x="1450" y="1056" font-size="12" fill="#64748b" text-anchor="middle">结构化日志（周五验证页用）</text>
  </g>

  <!-- ============ Arrows ============ -->
  <!-- fe → gw -->
  <path d="M240 256 L240 290 L280 290 L280 365" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- vpage → gw -->
  <path d="M520 256 L520 300 L240 300 L240 365" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- vpage → legacy (dashed data) -->
  <path d="M620 256 L620 365" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowData)"/>
  <!-- legacy → oldsys -->
  <path d="M823 400 L850 400 L850 204 L1477 204" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowData)"/>
  <text x="1150" y="196" font-size="12" fill="#0891b2">旧切分+旧提示词导入</text>
  <!-- gw → queue (enqueue) -->
  <path d="M270 491 L270 605" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="286" y="556" font-size="12" fill="#334155">enqueue</text>
  <!-- queue → parse -->
  <path d="M423 668 L517 668" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- parse → loop -->
  <path d="M803 668 L877 668" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ctx → loop -->
  <path d="M1337 668 L1270 668" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- prompts → loop -->
  <path d="M1380 748 L1380 736 L1270 736" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- loop → db (write) -->
  <path d="M963 806 L963 890 L500 890 L500 950" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="884" font-size="12" fill="#334155">shots + review_log 落库</text>
  <!-- queue → redis -->
  <path d="M383 731 L383 880 L800 880 L800 950" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- queue → llm -->
  <path d="M180 731 L180 957" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- gw → db read (right side corridor) -->
  <path d="M443 460 L470 460 L470 530 L840 530 L840 900 L500 900 L500 950" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- api ↔ 任务中心 (建档/状态回写/查询) -->
  <path d="M443 508 L1620 508 L1620 935 L1100 935 L1100 957" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1660" y="740" font-size="12" fill="#7c3aed" transform="rotate(90 1660 740)">建档 · 状态回写 · 查询</text>

  <!-- legend -->
  <g>
    <rect x="40" y="1166" width="1720" height="104" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" data-graph-role="legend"/>
    <text x="64" y="1196" font-size="13" font-weight="700" fill="#0f172a">主链路</text>
    <text x="64" y="1222" font-size="12" fill="#334155">POST /tasks（剧本+配置）→ 任务中心建档 → 入队 → LegacyImporter 旧切分导入 → 每镜 Shot Loop → 落库+状态回写 → 盲测打分页（pairs/scores）</text>
    <text x="64" y="1246" font-size="12" fill="#64748b">灰虚线 = 接口读库；青虚线 = 盲测打分链路（pairs→随机侧序→scores 归因落库）；紫线 = 任务中心集成（任务数据/状态单一事实源）。周一架子标准：主链路端到端跑通，模板/记忆等模块留空壳+TODO</text>
    <line x1="1140" y1="1192" x2="1180" y2="1192" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1190" y="1196" font-size="12" fill="#334155">控制/写入</text>
    <line x1="1140" y1="1222" x2="1180" y2="1222" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowData)"/>
    <text x="1190" y="1226" font-size="12" fill="#334155">对比数据</text>
    <line x1="1140" y1="1252" x2="1180" y2="1252" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="1190" y="1256" font-size="12" fill="#334155">读库</text>
    <line x1="1330" y1="1192" x2="1370" y2="1192" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1380" y="1196" font-size="12" fill="#334155">任务中心</text>
  </g>
</svg>
